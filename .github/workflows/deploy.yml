name: Deploy

# Deploys only after CI succeeds on main.
#
# Railway's GitHub auto-deploy must be turned OFF for the backend service
# (Service -> Settings -> Source -> disable "Auto Deploy"), otherwise Railway
# deploys on push and this CI gate is bypassed.
#
# Same for Vercel: set the frontend project's Git integration to "Ignored Build
# Step" or disconnect it, so only this workflow ships to production.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which target to deploy
        required: true
        default: both
        type: choice
        options: [both, backend, frontend]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Backend -> Railway
    runs-on: ubuntu-latest
    # workflow_run fires on failure too; only proceed when CI actually passed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        if: inputs.target != 'frontend'
        env:
          # Project token, created under Project Settings -> Tokens. Scoped to a
          # single environment, so no --environment flag is needed below.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ vars.RAILWAY_BACKEND_SERVICE || 'backend' }}
        run: railway up --service "$SERVICE" --ci

  frontend:
    name: Frontend -> Vercel
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        if: inputs.target != 'backend'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        if: inputs.target != 'backend'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # VITE_API_URL is baked in at build time. Set it as a Vercel project
          # env var so `vercel build` picks it up from the pulled config.
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        if: inputs.target != 'backend'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

  smoke:
    name: Post-deploy health check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always() && needs.backend.result == 'success'
    steps:
      - name: Wait for API to report healthy
        env:
          API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ]; then
            echo "PUBLIC_API_URL variable not set - skipping smoke test."
            exit 0
          fi
          # Railway does not cold-start, but a fresh deploy takes a moment to
          # swap over. Allow ~3 minutes.
          for attempt in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$API_URL/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "API healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}: /health returned ${code}; retrying in 10s."
            sleep 10
          done
          echo "API did not become healthy within the timeout."
          exit 1
