[project]
name = "smarthire-api"
version = "1.0.0"
description = "Production-oriented SmartHire REST API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "python-jose[cryptography]>=3.3,<4",
  "passlib[bcrypt]>=1.7,<2",
  "bcrypt>=4.0,<4.1",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3.13,<1",
  "Pillow>=10,<12",
  "scikit-learn>=1.5,<2",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "cloudinary>=1.41,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
