services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthire}
      POSTGRES_USER: ${POSTGRES_USER:-smarthire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smarthire}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smarthire}
      RESUME_STORAGE_PATH: /data/resumes
      AVATAR_STORAGE_PATH: /data/avatars
      INLINE_BACKGROUND_JOBS: "false"
      FRONTEND_ORIGINS: http://localhost:8080
    volumes:
      - resume-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build: ./backend
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smarthire}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smarthire}
      RESUME_STORAGE_PATH: /data/resumes
      AVATAR_STORAGE_PATH: /data/avatars
      INLINE_BACKGROUND_JOBS: "false"
    volumes:
      - resume-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "scripts/run_worker.py"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres-data:
  resume-data:
